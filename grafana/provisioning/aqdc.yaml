# 範例：先把 grafana/dashboards/*.json 複製到 /var/lib/grafana/dashboards/aqdc/（Grafana 的 systemd 沙箱讀不到 /home），
# 再把這個檔複製到 /etc/grafana/provisioning/dashboards/aqdc.yaml 並重啟 grafana-server。
apiVersion: 1
providers:
  - name: aqdc
    type: file
    folder: ""
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/aqdc
